<!DOCTYPE html>
<html>
<head>
    <title>Task 2</title>
</head>
<body>

    <h2>HTML Form in Table</h2>

    <form>
        <table border="1" width="500">
            <caption>Enter Information for Registration</caption>

            <tr>
                <td align="right">Username</td>
                <td>
                    <input type="text" value="Jon Doe">
                </td>
            </tr>

            <tr>
                <td align="right">Password</td>
                <td>
                    <input type="password" value="123456">
                </td>
            </tr>

            <tr>
                <td align="right">Gender</td>
                <td>
                    <input type="radio" name="gender" value="Male">
                    Male
                    <br>

                    <input type="radio" name="gender" value="Female">
                    Female
                </td>
            </tr>

            <tr>
                <td align="right">Courses</td>
                <td>
                    <input type="checkbox" name="course" value="Islamic Studies" checked>
                    Islamic Studies

                    <input type="checkbox" name="course" value="Pakistan Studies" checked>
                    Pakistan Studies

                    <input type="checkbox" name="course" value="Electronics">
                    Electronics I
                </td>
            </tr>

            <tr>
                <td align="right">City</td>
                <td>
                    <select name="city">
                        <option value="">Select City</option>
                        <option value="Wah">Wah</option>
                        <option value="Taxila">Taxila</option>
                        <option value="Rawalpindi" selected>Rawalpindi</option>
                        <option value="Islamabad">Islamabad</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td align="right">Actions</td>
                <td>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>
    </form>

</body>
</html>
