```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form action="/action.php" method="post">

        <fieldset>

            <legend><b>Personal Information</b></legend>

            <br>

            <label for="name">Enter Your Username:</label>
            <br>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required>

            <br><br>

            <label for="password">Enter Your Password:</label>
            <br>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" required>

        </fieldset>

        <br>

        <fieldset>

            <legend><b>Class Information</b></legend>

            <br>

            <label>Select Your Class:</label>
            <br><br>

            <input type="radio" value="class 10"
                   name="class" id="class10" required>
            <label for="class10">Class 10</label>

            <br>

            <input type="radio" value="class 11"
                   name="class" id="class11">
            <label for="class11">Class 11</label>

            <br><br>

            <label>Select Your Subjects:</label>
            <br><br>

            <input type="checkbox" value="maths"
                   name="subject" id="maths">
            <label for="maths">Maths</label>

            <br>

            <input type="checkbox" value="science"
                   name="subject" id="science">
            <label for="science">Science</label>

            <br>

            <input type="checkbox" value="english"
                   name="subject" id="english">
            <label for="english">English</label>

        </fieldset>

        <br>

        <fieldset>

            <legend><b>Additional Information</b></legend>

            <br>

            <label for="city">Choose Your City:</label>
            <br><br>

            <select name="city" id="city">

                <option value="">-- Select City --</option>
                <option value="Karachi">Karachi</option>
                <option value="Lahore">Lahore</option>
                <option value="Islamabad">Islamabad</option>
                <option value="Peshawar">Peshawar</option>

            </select>

            <br><br>

            <label for="feedback">Give Your Feedback:</label>
            <br><br>

            <textarea
                name="feedback"
                id="feedback"
                rows="6"
                cols="40"
                placeholder="Please give your feedback">
            </textarea>

        </fieldset>

        <br>

        <fieldset>

            <legend><b>Learning Video</b></legend>

            <br>

            <iframe
                width="400"
                height="250"
                src="https://www.youtube.com/embed/HcOc7P5BMi4"
                title="HTML Tutorial"
                allowfullscreen>
            </iframe>

        </fieldset>

        <br>

        <input type="submit" value="Submit Registration">

        <input type="reset" value="Reset">

    </form>

</body>

</html>
