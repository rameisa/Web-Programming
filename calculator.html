    <style>

        body {
            background-color: white;
            font-family: Arial, sans-serif;
            background-image: url("https://media.istockphoto.com/id/809971888/photo/night-sky-landscape.jpg?s=612x612&w=0&k=20&c=ku3RWu4DQ8ErN-KbT1Act72LMocTwSAAm3UDkLiako0=");
        }
        

        /* Large block behind calculator */
        .calculator {
            width: 305px;
            margin: 22px auto;
            padding: 15px;
            background-color: #50719c;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 7px;
        }

        td {
            text-align: center;
            padding: 0;
        }

         h1 {
    text-align: center;
    color: rgb(76, 110, 205);
    font-size: 40px;
}

        /* Display box detais*/
        .display {
            width: 100%;
            height: 85px;
            box-sizing: border-box;
            border: none;
            background-color: #f7f7f7;
            font-size: 28px;
            text-align: right;
            padding: 10px;
        }

        /* Normal buttons details in my calculator */
        input[type="submit"] {
            width: 60px;
            height: 58px;
            border: none;
            background-color: #f1f1f1;
            font-size: 21px;
            font-weight: bold;
            color: #555555;
            cursor: pointer;
        }

        /* Hover: make changes to button when we place mouse on it  */
       input[type="submit"]:hover {
            background-color: #b6b4b4;
    
}
        /* Zero button details */
        .zero {
            width: 127px !important;
        }

        /* Plus button details */
        .plus {
            width: 60px !important;
            height: 123px !important;
            background-color: #f1f1f1 !important;
            color: #555555 !important;
        }

        /* Delete button details*/
        .delete {
            width: 60px !important;
            height: 58px !important;
            background-color: #ed0754 !important;
            color: white !important;
        }

        /* Equal button details*/
        .equal {
            width: 127px !important;
            height: 58px !important;
            background-color: #7acb7c !important;
            color: white !important;
        }

        input[type="submit"] {
    border-radius: 8px !important;
} 

.display,
.zero,
.plus,
.delete,
.equal {
    border-radius: 8px !important;
}
    </style>
</head>

<body>
<h1>My Calculator</h1>
<div class="calculator">

    <form>


        <table>

            <!-- DISPLAY -->
            <tr>
                <td colspan="4">
                    <input type="text" class="display" name="display">
                </td>
            </tr>


            <!-- √  (  )  % -->
            <tr>
                <td>
                    <input type="submit" value="√">
                </td>

                <td>
                    <input type="submit" value="(">
                </td>

                <td>
                    <input type="submit" value=")">
                </td>

                <td>
                    <input type="submit" value="%">
                </td>
            </tr>


            <!-- 7  8  9  / -->
            <tr>
                <td>
                    <input type="submit" value="7">
                </td>

                <td>
                    <input type="submit" value="8">
                </td>

                <td>
                    <input type="submit" value="9">
                </td>

                <td>
                    <input type="submit" value="/">
                </td>
            </tr>


            <!-- 4  5  6  × -->
            <tr>
                <td>
                    <input type="submit" value="4">
                </td>

                <td>
                    <input type="submit" value="5">
                </td>

                <td>
                    <input type="submit" value="6">
                </td>

                <td>
                    <input type="submit" value="×">
                </td>
            </tr>


            <!-- 1  2  3  - -->
            <tr>
                <td>
                    <input type="submit" value="1">
                </td>

                <td>
                    <input type="submit" value="2">
                </td>

                <td>
                    <input type="submit" value="3">
                </td>

                <td>
                    <input type="submit" value="-">
                </td>
            </tr>


            <!-- 0  .  + -->
            <tr>

                <td colspan="2">
                    <input type="submit" value="0" class="zero">
                </td>

                <td>
                    <input type="submit" value=".">
                </td>

                <!-- PLUS -->
                <td rowspan="2">
                    <input type="submit" value="+" class="plus">
                </td>

            </tr>


            <!-- DEL  = -->
            <tr>

                <td>
                    <input type="submit" value="Del" class="delete">
                </td>

                <td colspan="2">
                    <input type="submit" value="=" class="equal">
                </td>

            </tr>

        </table>

    </form>

</div>

</body>
</html>
